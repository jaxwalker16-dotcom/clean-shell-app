<style>
:root{--navy:#071C2F;--royal:#071C2F;--sky:#AFD8FF;--shell:#F2F4F1;--sage:#68A482;--ink:#071C2F;--mute:#4A5866;--line:#D9DED6;--red:#b03a2e;--display:"Sansita",Georgia,serif;--body:"Nunito Sans",-apple-system,system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--shell);color:var(--ink);font:16px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(var(--safe-t) + 10px) 16px 12px;display:flex;align-items:center;gap:10px}
header.top h1{font-family:var(--display);font-weight:800;font-size:22px;text-shadow:2px 2px 0 rgba(175,216,255,.35);margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .icon-btn{background:none;border:0;color:#fff;font-size:22px;padding:4px 6px;min-width:40px}
main{padding:14px 14px calc(var(--safe-b) + 90px);max-width:720px;margin:0 auto}
.card{background:var(--shell);border:1.5px solid var(--line);box-shadow:0 2px 0 rgba(7,28,47,.05);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-family:var(--display);font-weight:800;font-size:19px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card h2 .count{margin-left:auto;font-weight:500;color:var(--mute);font-size:14px}
.sub{color:var(--mute);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--navy);border-radius:999px;padding:11px 18px;background:var(--navy);color:var(--shell);font-weight:700;min-height:46px;font-family:var(--body)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.alt{background:var(--sage);border-color:var(--sage);color:var(--navy)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
.fab{text-decoration:none;position:fixed;right:18px;bottom:calc(var(--safe-b) + 18px);z-index:6;padding:14px 22px;background:var(--sage);border-color:var(--sage);color:var(--navy);box-shadow:0 6px 18px rgba(7,28,47,.3)}
.job{display:block;text-decoration:none;color:inherit}
.job .meta{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--navy);color:var(--shell)}
.pill.done{background:var(--sage);color:var(--navy)}
.pill.warn{background:var(--sky);color:var(--navy)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:10px 0 4px}
input.t,textarea.t,select.t{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--shell);font-size:16px;font-family:var(--body);color:var(--navy)}
input.t:focus,textarea.t:focus,select.t:focus{outline:2px solid var(--sky);border-color:var(--navy)}
textarea.t{min-height:80px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.shot{background:var(--shell);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.shot .pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.thumb{position:relative;aspect-ratio:3/4;background:#dfe3dc center/cover no-repeat;border:0;padding:0;width:100%;display:block}
.thumb .tag{position:absolute;left:5px;top:5px;font-size:10px;font-weight:700;background:rgba(7,28,47,.85);color:var(--shell);padding:2px 6px;border-radius:6px;letter-spacing:.3px}
.thumb .vid{position:absolute;right:5px;bottom:5px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;padding:1px 6px;border-radius:6px}
.thumb .cloud{position:absolute;right:5px;top:5px;font-size:11px;background:var(--sage);color:var(--navy);font-weight:700;padding:1px 5px;border-radius:6px}
.add-after{aspect-ratio:3/4;border:2px dashed var(--sage);background:var(--shell);color:var(--navy);font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%}
.shot .lbl{font-size:13px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.checklist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.banner{background:var(--sky);border:1.5px solid var(--navy);color:var(--navy);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;font-size:14px}
.banner .btn{min-height:36px;padding:8px 12px;font-size:14px}
.soon{opacity:.6}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:14px}
dl.info dt{color:var(--mute)} dl.info dd{margin:0}
/* Camera */
#camera{position:fixed;inset:0;z-index:50;background:#000;display:none;color:#fff}
#camera.on{display:block}
#camera video,#camera .ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#camera .ghost{pointer-events:none;opacity:.4}
#camera .gridlines{position:absolute;inset:0;pointer-events:none;display:none;
  background-image:linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
  linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
#camera.grid-on .gridlines{display:block}
.cam-top{position:absolute;top:0;left:0;right:0;padding:calc(var(--safe-t) + 10px) 12px 10px;display:flex;align-items:center;gap:8px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.cam-top .title{flex:1;font-weight:600;font-size:15px;text-align:center}
.cam-btn{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;padding:7px 12px;font-size:14px}
.cam-btn.active{background:var(--sky);color:var(--navy);border-color:var(--sky)}
.cam-btn{font-family:var(--body);font-weight:700}
.cam-bottom{position:absolute;bottom:0;left:0;right:0;padding:14px 16px calc(var(--safe-b) + 18px);background:linear-gradient(transparent,rgba(0,0,0,.7))}
.cam-ghostctl{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:12px}
.cam-ghostctl input{flex:1;accent-color:var(--sky)}
.cam-row{display:flex;align-items:center;justify-content:space-between}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);padding:0}
.shutter.rec{background:#e53935;border-color:#fff}
.shutter.recording{border-radius:18px;background:#e53935;transform:scale(.8)}
.cam-side{width:90px;display:flex;justify-content:center}
.cam-last{width:52px;height:52px;border-radius:10px;background:#333 center/cover;border:2px solid #fff}
.cam-mode{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.cam-count{font-size:13px;text-align:center;margin-top:4px;min-height:18px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.rec-time{position:absolute;top:calc(var(--safe-t) + 60px);left:50%;transform:translateX(-50%);background:#e53935;padding:3px 10px;border-radius:10px;font-weight:700;display:none}
/* Viewer */
#viewer{position:fixed;inset:0;z-index:40;background:rgba(7,28,47,.97);display:none;color:#fff;flex-direction:column}
#viewer.on{display:flex}
#viewer .v-top{padding:calc(var(--safe-t) + 10px) 12px 10px;display:flex;align-items:center;gap:8px}
#viewer .v-top .title{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer .stage{flex:1;position:relative;overflow:hidden;margin:0 10px;border-radius:12px;background:#000}
#viewer .stage img,#viewer .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#viewer .stage .clip{position:absolute;inset:0;overflow:hidden}
#viewer .divider{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.6);pointer-events:none}
#viewer .divider::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:var(--navy);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:700}
#viewer .stage .cap{position:absolute;top:8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:6px}
#viewer .v-actions{padding:12px 12px calc(var(--safe-b) + 14px);display:grid;grid-template-columns:1fr 1fr;gap:8px}
#viewer .v-actions .btn{min-height:44px;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translateX(-50%);background:var(--navy);color:var(--shell);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.hidden{display:none!important}
.demo-note{background:transparent;color:#6F8396;font-size:11px;font-weight:500;padding:2px 16px 0;text-align:center}
#dlg{position:fixed;inset:0;z-index:70;background:rgba(7,28,47,.55);display:none;align-items:center;justify-content:center;padding:20px}
#dlg.on{display:flex}
#dlg .box{background:var(--card);color:var(--shell);border:1.5px solid var(--line);border-radius:16px;padding:18px;max-width:400px;width:100%}
#dlg p{margin:0 0 12px}
.section-tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--sage);color:var(--navy);margin-left:4px}

/* Dark Clean Shell theme: Navy leads, Shell + Sky as secondary */
:root{color-scheme:dark;--royal:var(--sky);--mute:#A9B8C6;--line:rgba(175,216,255,.18);--card:#0C2740}
html,body{background:var(--navy);color:var(--shell)}
a{color:var(--sky)}
header.top{border-bottom:1px solid var(--line)}
.card{background:var(--card);border:1.5px solid var(--line);box-shadow:none}
.btn{background:var(--sky);border-color:var(--sky);color:var(--navy)}
.btn.ghost{background:transparent;border-color:rgba(242,244,241,.55);color:var(--shell)}
.btn.alt,.fab{background:var(--sage);border-color:var(--sage);color:var(--navy)}
.btn.danger{background:transparent;border-color:#ff9a8f;color:#ff9a8f}
.pill{background:var(--sky);color:var(--navy)}
.pill.done{background:var(--sage);color:var(--navy)}
.pill.warn{background:var(--shell);color:var(--navy)}
input.t,textarea.t,select.t{background:var(--navy);border-color:var(--line);color:var(--shell)}
input.t::placeholder,textarea.t::placeholder{color:#6f8396}
input.t:focus,textarea.t:focus,select.t:focus{outline:2px solid var(--sky);border-color:var(--sky)}
.shot{background:var(--navy);border-color:var(--line)}
.thumb{background-color:#163452}
.add-after{background:transparent;border-color:var(--sky);color:var(--sky)}
.banner{background:var(--sky);border-color:var(--sky);color:var(--navy)}
#toast{background:var(--shell);color:var(--navy)}
.banner .btn{background:var(--navy);border-color:var(--navy);color:var(--shell)}
.soon{opacity:.55}

/* Sleek app pass: Inter, soft surfaces, icons instead of emoji */
:root{--display:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--body:var(--display);--card:#0B2239;--mute:#9FB0C2}
html,body{-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
header.top{background:rgba(7,28,47,.82);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-bottom:1px solid rgba(255,255,255,.06);gap:4px}
header.top h1{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;text-shadow:none}
header.top .icon-btn{width:40px;height:40px;min-width:40px;padding:0;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;position:relative;color:var(--shell)}
header.top .icon-btn:active{background:rgba(255,255,255,.08)}
header.top .icon-btn svg{width:22px;height:22px}
.badge{position:absolute;top:1px;right:-1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--sky);color:var(--navy);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.badge.warn{background:#FFD27A}
main{padding-top:16px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:none}

.btn{font-family:var(--display);border:0;border-radius:14px;min-height:48px;font-weight:600;font-size:15px;letter-spacing:-.01em;background:var(--sky);color:var(--navy);transition:transform .12s,opacity .12s}

.seg{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin-top:12px}

label.f{font-size:12px;font-weight:600;color:var(--mute);margin:14px 0 6px}
input.t,textarea.t,select.t{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;font-family:var(--display)}
.grid{gap:12px;margin-top:14px}
.shot{background:transparent;border:0;border-radius:14px;overflow:visible}

.thumb{background-color:#15324F}

/* phase 4 */
main{padding-bottom:calc(var(--safe-b) + 150px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(6,1fr);padding:6px 10px calc(var(--safe-b) + 6px);background:rgba(7,28,47,.86);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid rgba(255,255,255,.07)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:#6F8396;text-decoration:none;font-size:11px;font-weight:600}
.tabs a svg{width:23px;height:23px}
.tabs a.on{color:var(--sky)}
.tabs:not(.hidden)~.fab,body:has(.tabs:not(.hidden)) .fab{bottom:calc(var(--safe-b) + 82px)}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(255,255,255,.06);padding:4px;border-radius:12px;margin:12px 0 6px}

.sizes button.on{background:var(--sky);color:var(--navy)}
.item{display:grid;grid-template-columns:1fr 96px 36px;gap:6px;align-items:center;margin-top:8px}
.item input{padding:10px 10px}
.money{text-align:right;font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;border:0;border-radius:10px;background:rgba(255,255,255,.06);color:var(--mute);display:flex;align-items:center;justify-content:center}
.x svg{width:16px;height:16px}
#q_add{margin-top:10px}
.totals{margin-top:12px;border-top:1px solid rgba(255,255,255,.08);padding-top:8px}
.totals>div{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:15px;color:#C9D4DE;font-variant-numeric:tabular-nums}
.totals input{width:110px;padding:8px 10px}
.totals .grand{font-size:22px;font-weight:700;color:var(--shell);letter-spacing:-.02em}
.payrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.paidrow{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:#8FD1AB;font-weight:600;font-size:14px}
.paidrow span{display:flex;align-items:center;gap:6px}.paidrow svg{width:16px;height:16px}
.card.due h2 svg{width:18px;height:18px;color:#FFD27A;margin-right:2px}
.duerow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}
.duerow:first-of-type{border-top:0}
.duerow a{flex:1;display:flex;flex-direction:column;color:var(--shell);text-decoration:none;font-weight:400}
.duerow .btn{min-height:38px;padding:0 12px;font-size:13px}
.search{margin-bottom:14px}
.hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid rgba(255,255,255,.06);color:var(--shell);text-decoration:none;font-weight:400}
.card h2+.hist{border-top:0}
.hist>span:first-child{display:flex;flex-direction:column;min-width:0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats3>div,.kpi{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stats3 b{font-size:18px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats3 span,.kpi span{font-size:12px;color:var(--mute);font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi.big{grid-column:1/-1;padding:18px}
.kpi b{font-size:24px;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.kpi.big b{font-size:40px;color:var(--sky)}
.kpi small{font-size:12px;color:var(--mute)}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bar{display:grid;grid-template-columns:36px 1fr 74px;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.bar i{display:block;height:12px;border-radius:6px;background:var(--sky);min-width:3px}
.bar b{text-align:right;color:var(--shell);font-weight:600;font-variant-numeric:tabular-nums}
.svc{padding:12px 0;border-top:1px solid rgba(255,255,255,.06)}
.svc-top{display:grid;grid-template-columns:1fr 36px;gap:6px}
.svc-prices{display:grid;grid-template-columns:repeat(3,1fr) 1.3fr;gap:6px;margin-top:6px}
.svc-prices input{padding:9px 8px;font-size:15px}

/* phase 5 */
.msgbtns,.etas{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:0;border-radius:999px;padding:9px 14px;background:rgba(175,216,255,.12);color:var(--sky);font:600 14px var(--display)}
.chip.on{background:var(--sky);color:var(--navy)}
.msglog{margin-top:12px;border-top:1px solid rgba(255,255,255,.06);padding-top:6px}
.msglog>div{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:14px}
.msglog span:first-child{display:flex;align-items:center;gap:6px}
.msglog svg{width:14px;height:14px;color:#8FD1AB}
#sheet{position:fixed;inset:0;z-index:65;background:rgba(3,12,22,.6);display:none;align-items:flex-end}
#sheet.on{display:flex}
.sheet-box{width:100%;max-width:720px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:16px 16px calc(var(--safe-b) + 18px);border-top:1px solid rgba(255,255,255,.08)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font-size:17px;margin-bottom:2px}

/* phase 6 */
.tabs a{position:relative}
.tbadge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#FF7A6E;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sky);margin-right:6px;vertical-align:1px}
.chat{display:flex;flex-direction:column;gap:6px;padding-bottom:150px}
.bubble{max-width:80%;padding:9px 12px 6px;border-radius:18px;font-size:15px;line-height:1.35;word-wrap:break-word}
.bubble span{display:block;font-size:10.5px;opacity:.6;margin-top:3px;text-align:right}
.bubble.in{align-self:flex-start;background:var(--card);border:1px solid rgba(255,255,255,.07);border-bottom-left-radius:6px}
.bubble.out{align-self:flex-end;background:var(--sky);color:var(--navy);border-bottom-right-radius:6px}
.daysep{align-self:center;font-size:12px;color:var(--mute);margin:10px 0 4px}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:10px 12px calc(var(--safe-b) + 10px);background:rgba(7,28,47,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.07)}
.composer .msgbtns{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.composer .chip{flex:none;padding:7px 12px;font-size:13px}
.compose-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;max-width:720px;margin:0 auto}
.compose-row textarea{min-height:46px;max-height:160px;resize:none;border-radius:16px}
.compose-row .btn{min-height:46px;padding:0 18px}

/* phase 7 */
.tabs a span{white-space:nowrap}
.section-h{font-size:13px;font-weight:600;color:var(--mute);margin:4px 4px 8px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.warnline{color:#FFD27A;margin-top:8px}
.week{display:grid;grid-template-columns:36px 1fr 36px;gap:6px;align-items:center;margin-bottom:14px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:0;background:transparent;color:var(--shell);border-radius:14px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--display)}
.day span{font-size:11px;color:var(--mute);font-weight:600}
.day b{font-size:17px;font-weight:600}
.day i{font-style:normal;font-size:10px;color:var(--sky);height:10px;line-height:10px;letter-spacing:1px}
.day.today b{color:var(--sky)}
.day.on{background:var(--sky);color:var(--navy)}.day.on span,.day.on i,.day.on b{color:var(--navy)}
.dayhead{display:flex;justify-content:space-between;align-items:center;margin:0 4px 12px}
.dayhead>div{display:flex;flex-direction:column}
.dayhead b{font-size:18px;letter-spacing:-.02em}
.agenda{display:grid;grid-template-columns:76px 1fr;gap:12px}
.agenda.past{opacity:.55}
.ag-time{display:flex;flex-direction:column;border-right:2px solid var(--sky);padding-right:10px}
.ag-time b{font-size:14px;white-space:nowrap}.ag-time span{font-size:12px;color:var(--mute);white-space:nowrap}
.ag-title{display:flex;flex-direction:column;color:var(--shell);text-decoration:none;font-weight:400}
.ag-title b{font-size:16px}
.ag-addr{margin-top:4px}
.ag-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ag-actions .btn{min-height:36px;padding:0 12px;font-size:13px;text-decoration:none}
.meta{margin-top:8px}

/* phase 8 */
.tabs a span{font-size:10.5px}
.tabs a svg{width:22px;height:22px}
.monthnav{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;text-align:center;margin-bottom:14px;font-size:17px}
.exrow{width:100%;background:none;border:0;border-top:1px solid rgba(255,255,255,.06);text-align:left;font-family:var(--display);cursor:pointer}
.card h2+.exrow{border-top:0}
.exr{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.exr i{color:var(--mute);display:flex}.exr svg{width:15px;height:15px}
.bar.wide{grid-template-columns:130px 1fr 74px}
.bar.wide span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.receipt-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.receipt-row img{height:56px;border-radius:8px}
.sheet-box{max-height:88vh;overflow-y:auto}
.pk-list{max-height:55vh;overflow-y:auto;margin-top:8px}
.pk-list .exrow svg{width:18px;height:18px;color:var(--mute)}
.kpis .kpi:nth-child(4){}

/* phase 9 */
.tabs{padding-left:2px;padding-right:2px}
.tabs a span{font-size:10px;letter-spacing:-.01em}
.tabs a svg{width:21px;height:21px}
.secchips{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 14px;padding:0 14px 2px;scrollbar-width:none}
.secchips::-webkit-scrollbar{display:none}
.secchips .chip{flex:none}
.plist{padding:4px 14px}
.prow{display:grid;grid-template-columns:48px 1fr 20px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.06);color:var(--shell);text-decoration:none;font-weight:400}
.plist .prow:first-child{border-top:0}
.pthumb{width:48px;height:48px;border-radius:12px;background:#15324F center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.pthumb svg{width:22px;height:22px}
.pmain{display:flex;flex-direction:column;min-width:0}
.pmain b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.prow .chev{color:#5F7489;display:flex}.prow .chev svg{width:18px;height:18px}
.phero{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.phero>div{display:flex;flex-direction:column}
.phero b{font-size:18px;letter-spacing:-.02em}
.pphoto{width:96px;height:96px;border-radius:16px;border:1.5px dashed rgba(175,216,255,.35);background:rgba(175,216,255,.05) center/cover no-repeat;color:var(--sky);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 12px var(--display)}
.pphoto[style]{border:0}
.pphoto svg{width:22px;height:22px}

/* Apple pass */
:root{--display:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;--body:var(--display);--card:#0D2640;--sep:rgba(255,255,255,.08);--tint:rgba(175,216,255,.13)}
html,body{letter-spacing:-.01em}
header.top{padding:calc(var(--safe-t) + 8px) 12px 8px;background:rgba(7,28,47,.78);border-bottom:.5px solid var(--sep)}
header.top h1{font-size:17px;font-weight:600;letter-spacing:-.02em;text-align:center}
header.top:not(.large) h1{position:absolute;left:64px;right:64px;pointer-events:none}
header.top.large{padding-bottom:10px;border-bottom-color:transparent;background:var(--navy)}
header.top.large h1{font-size:32px;font-weight:700;letter-spacing:-.03em;text-align:left;padding-left:6px;padding-top:6px}
header.top .icon-btn{color:var(--sky)}
header.top .icon-btn svg{width:24px;height:24px}
#addBtn svg{width:26px;height:26px;stroke-width:2.2}
main{padding:10px 16px calc(var(--safe-b) + 110px)}
.card{background:var(--card);border:0;border-radius:14px;padding:14px 16px;margin-bottom:22px}
.card h2{font-size:17px;font-weight:600}
.section-h{font-size:13px;font-weight:500;color:var(--mute);margin:0 16px 7px;letter-spacing:0}
.group{background:var(--card);border-radius:14px;margin-bottom:22px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 14px 11px 16px;color:var(--shell);text-decoration:none;font-weight:400;position:relative;min-height:60px}
.lrow+.lrow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.lrow:active{background:rgba(255,255,255,.05)}
.lmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lmain b{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmain .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.lside{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.ltime{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.ltags{display:flex;align-items:center;gap:6px}
.lcount{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--mute)}.lcount svg{width:13px;height:13px}
.lmoney{font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
.lrow .chev{color:#4E6378;display:flex;flex:none}.lrow .chev svg{width:16px;height:16px;stroke-width:2.4}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(160deg,#2B4A6B,#1A3552);color:var(--sky);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:none}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px}
.pill.muted{background:rgba(255,255,255,.07);color:var(--mute)}
.btn{border-radius:12px;font-weight:600;font-size:16px;min-height:50px}
.btn.ghost{background:var(--tint);color:var(--sky)}
.btn.alt{background:var(--sage);color:var(--navy)}
.btn.danger{background:rgba(255,105,97,.13);color:#FF7B73}
.chip{background:rgba(255,255,255,.08);color:var(--shell);font-weight:500}
.chip.on{background:var(--sky);color:var(--navy)}
input.t,textarea.t,select.t{background:rgba(255,255,255,.06);border:0;border-radius:10px}
input.t:focus,textarea.t:focus,select.t:focus{outline:2px solid rgba(175,216,255,.55);outline-offset:0}
label.f{font-size:13px;font-weight:500;margin:14px 2px 6px}
.search{border-radius:10px;padding-left:14px}
.tabs{background:rgba(9,24,40,.82);border-top:.5px solid var(--sep);padding-top:7px}
.tabs a{color:#7B8C9D;font-weight:500}
.tabs a.on{color:var(--sky)}
.tabs a span{font-size:10px}
.fab{display:none!important}
.kpi,.stats3>div{background:var(--card);border:0;border-radius:14px}
.kpi.big b{color:var(--shell)}
.sizes{background:rgba(255,255,255,.07);border-radius:10px;padding:3px}
.sizes button{border-radius:8px;font-weight:600}
.sizes button.on{background:#3A5A7C;color:var(--shell);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hist{border-top:.5px solid var(--sep)}
.duerow{border-top:.5px solid var(--sep)}
.card.due{background:linear-gradient(180deg,rgba(255,210,122,.08),rgba(255,210,122,.03)),var(--card)}
.agenda{background:var(--card)}
.ag-time{border-right:3px solid var(--sky)}
.empty{color:var(--mute);padding:80px 10px}
.empty .ring{border-radius:22px;width:68px;height:68px}
.empty p{margin-top:14px}
.thumb,.shot .pair{border-radius:12px}
.sheet-box{background:#10293F;border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.sheet-box::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:-6px auto 10px}
#toast{background:rgba(242,244,241,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:20px;padding:10px 18px}
.plist{padding:0 16px}
.prow{border-top:.5px solid var(--sep)}
.pthumb{border-radius:10px}

/* phase 10 */
.scrollx{flex-wrap:nowrap;overflow-x:auto;margin-right:-16px;padding-right:16px;scrollbar-width:none}.scrollx::-webkit-scrollbar{display:none}.scrollx .chip{flex:none}
.optbar{display:flex;gap:6px;overflow-x:auto;margin:12px 0 4px;scrollbar-width:none}
.optbar button{flex:none;border:0;border-radius:9px;padding:8px 12px;background:rgba(255,255,255,.07);color:var(--shell);font:600 14px var(--display);display:flex;align-items:center}
.optbar button.on{background:var(--sky);color:var(--navy)}
.optbar button svg{width:16px;height:16px}
.optlabel{display:grid;grid-template-columns:1fr 36px;gap:6px;margin-top:8px}
.signed{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(104,164,130,.12);color:#8FD1AB;font-size:14px;font-weight:600}
.signed img{height:40px;background:#F2F4F1;border-radius:8px;padding:2px 6px}
.signed span{display:flex;align-items:center;gap:6px}.signed svg{width:15px;height:15px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:.5px solid var(--sep);font-size:16px;color:var(--shell);cursor:pointer}
.card h2+.toggle{border-top:0}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle i{width:51px;height:31px;border-radius:16px;background:rgba(255,255,255,.16);position:relative;flex:none;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.toggle input:checked+i{background:var(--sage)}.toggle input:checked+i::after{transform:translateX(20px)}
.linkrow{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);font-size:13px}
.linkrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
#portalPrev{position:fixed;inset:0;z-index:66;background:#F2F4F1;display:none;flex-direction:column}
#portalPrev.on{display:flex}
.pp-bar{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--safe-t) + 8px) 12px 8px 16px;background:#E3E7E2;color:#071C2F;font-weight:600;font-size:14px}
.pp-bar .x{background:#fff;color:#5C6B7A}
.pp-body{flex:1;overflow-y:auto}
.pp-body .pc .ph{padding-top:22px}
.sheet-box.pc label{color:#5C6B7A}

/* phase 11: address lookup, directions, referral sources */
.ac{margin-top:4px;background:#10293F;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.ac button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;color:var(--shell);text-align:left;padding:10px 12px;font:500 15px var(--display);border-top:.5px solid var(--sep);cursor:pointer}
.ac button:first-child{border-top:0}
.ac button span{font-size:13px;color:var(--mute);font-weight:400}
.ac button:hover,.ac button:active{background:rgba(175,216,255,.12)}
.ac-note{font-size:12px;color:var(--mute);margin:5px 2px 0;display:flex;align-items:center;gap:4px}
.ac-note.ok{color:#8FD1AB}.ac-note svg{width:13px;height:13px;flex:none}
.addr-link{color:var(--sky);background:none;border:0;padding:0;font:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(175,216,255,.4);text-underline-offset:3px}
.addrbar{display:flex;align-items:center;gap:12px}
.addrbar .pinic{width:38px;height:38px;border-radius:50%;background:var(--tint);color:var(--sky);display:flex;align-items:center;justify-content:center;flex:none}
.addrbar .pinic svg{width:19px;height:19px}
.addrbar .lmain b{white-space:normal}
.maps{display:grid;gap:8px;margin-top:12px}
.maps a{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:rgba(255,255,255,.06);color:var(--shell);text-decoration:none;font-weight:600}
.maps a svg{width:18px;height:18px;color:var(--sky)}
.maps a.on{outline:2px solid rgba(175,216,255,.5)}
.ref-row{display:grid;grid-template-columns:1fr 36px;gap:6px;margin-top:8px}

/*PORTAL-CSS-START*/
.pc{--n:#071C2F;--s:#F2F4F1;--sky:#AFD8FF;--sage:#68A482;--m:#5C6B7A;--line:#E2E6E1;--card:#FFFFFF;font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--n);background:var(--s);letter-spacing:-.01em;min-height:100%}
.pc *{box-sizing:border-box}
.pc .ph{background:var(--n);color:var(--s);padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 26px}
.pc .ph small{display:block;color:var(--sky);font-size:13px;font-weight:600;margin-bottom:6px}
.pc .ph h1{margin:0;font-size:28px;letter-spacing:-.03em;line-height:1.1}
.pc .ph p{margin:6px 0 0;color:#C8D6E3;font-size:15px}
.pc .pw{max-width:620px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.pc .pcard{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(7,28,47,.06)}
.pc .pcard h2{font-size:18px;margin:0 0 4px;letter-spacing:-.02em}
.pc .muted{color:var(--m);font-size:14px}
.pc .opts{display:grid;gap:10px;margin-top:12px}
.pc .opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;font:inherit;color:inherit;cursor:pointer}
.pc .opt.on{border-color:var(--n);box-shadow:0 0 0 3px rgba(175,216,255,.6)}
.pc .opt .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pc .opt b{font-size:17px}.pc .opt .price{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

function ask(msg, withInput, val) { return new Promise(res => { $('#dlgMsg').textContent = msg; const i = $('#dlgInput'); i.classList.toggle('hidden', !withInput); i.value = val || ''; $('#dlg').classList.add('on'); if (withInput) setTimeout(() => i.focus(), 50); const done = v => { $('#dlg').classList.remove('on'); res(v); }; $('#dlgYes').onclick = () => done(withInput ? i.value : true); $('#dlgNo').onclick = () => done(withInput ? null : false); }); }
/* ---------- storage (IndexedDB, stays inside the app, not the camera roll) ---------- */
const DB = (() => {
  let dbp;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('cleanshell', 4);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('jobs')) db.createObjectStore('jobs', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('media')) { const m = db.createObjectStore('media', { keyPath: 'id' }); m.createIndex('jobId', 'jobId'); }
        if (!db.objectStoreNames.contains('customers')) db.createObjectStore('customers', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('expenses')) db.createObjectStore('expenses', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('products')) db.createObjectStore('products', { keyPath: 'id' });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function run(store, mode, fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, mode);
      const out = fn(tx.objectStore(store));
      tx.oncomplete = () => res(out && 'result' in out ? out.result : out);
      tx.onerror = () => rej(tx.error);
    });
  }
  return {
    put: (s, v) => run(s, 'readwrite', st => st.put(v)).then(r => { if (s === 'jobs' && typeof queueFollowupSync === 'function') { queueFollowupSync(); queueBookingPublish(); } return r; }),
    get: (s, k) => run(s, 'readonly', st => st.get(k)),
    del: (s, k) => run(s, 'readwrite', st => st.delete(k)),
    all: s => run(s, 'readonly', st => st.getAll()),
    byJob: jobId => run('media', 'readonly', st => st.index('jobId').getAll(jobId)),
  };
})();

  pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  nav: '<path d="M3 11l18-8-8 18-2-8z"/>',
  car: '<path d="M5 17H3.8a.8.8 0 0 1-.8-.8V13a2 2 0 0 1 .4-1.2L5.6 7.8A2 2 0 0 1 7.3 7h9.4a2 2 0 0 1 1.7.8l2.2 4A2 2 0 0 1 21 13v3.2a.8.8 0 0 1-.8.8H19"/><path d="M9 17h6M3.5 12h17"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
};
const I = n => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slug = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms); }

const urlCache = new Map();
function blobUrl(id, blob) { if (!blob) return ''; if (!urlCache.has(id)) urlCache.set(id, URL.createObjectURL(blob)); return urlCache.get(id); }
function dropUrl(id) { if (urlCache.has(id)) { URL.revokeObjectURL(urlCache.get(id)); urlCache.delete(id); } }

/* ---------- settings ---------- */
const Settings = {
  get() { try { return JSON.parse(localStorage.getItem('cs_settings') || '{}'); } catch { return {}; } },
  set(patch) { const s = { ...this.get(), ...patch }; try { localStorage.setItem('cs_settings', JSON.stringify(s)); } catch {} return s; },
};

/* ---------- media helpers ---------- */
function videoPoster(blob) {
  return new Promise(res => {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    const url = URL.createObjectURL(blob);
    let done = false;
    const finish = b => { if (done) return; done = true; URL.revokeObjectURL(url); res(b); };
    v.onloadeddata = () => { try { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); } catch { finish(null); } };
    v.onseeked = () => {
      const c = document.createElement('canvas');
      c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext('2d').drawImage(v, 0, 0);
      c.toBlob(b => finish(b), 'image/jpeg', 0.8);
    };
    v.onerror = () => finish(null);
    setTimeout(() => finish(null), 6000);
    v.src = url;
  });
}
const isVideo = m => (m.mime || '').startsWith('video/');
const AREAS = { interior: 'Interior', exterior: 'Exterior' };
const areaOf = m => m.area || 'interior';
const previewBlob = m => isVideo(m) ? m.poster : m.blob;

async function addMedia(job, kind, blob, extra = {}) {
  const all = await DB.byJob(job.id);
  const m = { id: uid(), jobId: job.id, kind, blob, mime: blob.type || 'image/jpeg', createdAt: Date.now(), driveId: null, label: '', ...extra };
  if (kind === 'before') { m.area = m.area || 'interior'; m.n = Math.max(0, ...all.filter(x => x.kind === 'before' && areaOf(x) === m.area).map(x => x.n || 0)) + 1; }
  if (kind === 'checklist') m.n = all.filter(x => x.kind === 'checklist').length + 1;
  if (isVideo(m) && !m.poster) m.poster = await videoPoster(blob);
  await DB.put('media', m);
  Drive.kick();
  return m;
}

/* ---------- Google Drive (redirect sign-in works inside the installed app) ---------- */
const Drive = {
  token() {
    const t = Settings.get();
    return t.token && t.tokenExp > Date.now() + 60000 ? t.token : null;
  },
  connectedOnce() { return !!Settings.get().driveEverConnected; },
  signIn() {
    const s = Settings.get();
    if (!s.clientId) { toast('Add your Google Client ID in Settings first'); nav('#/settings'); return; }
    try { localStorage.setItem('cs_return', location.hash || '#/'); } catch {}
    const p = new URLSearchParams({
      client_id: s.clientId,
      redirect_uri: location.origin + location.pathname,
      response_type: 'token',
      scope: 'https://www.googleapis.com/auth/drive.file',
      include_granted_scopes: 'true',
    });
    if (s.email) p.set('login_hint', s.email);
    location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + p.toString();
  },
  handleRedirect() {
    if (!location.hash.includes('access_token=')) return false;
    const p = new URLSearchParams(location.hash.slice(1));
    Settings.set({ token: p.get('access_token'), tokenExp: Date.now() + (+p.get('expires_in') || 3600) * 1000, driveEverConnected: true });
    let back = '#/';
    try { back = localStorage.getItem('cs_return') || '#/'; } catch {}
    history.replaceState(null, '', location.pathname + back);
    setTimeout(() => { toast('Google Drive connected'); Drive.sync(); }, 300);
    return true;
  },
  signOut() { Settings.set({ token: null, tokenExp: 0 }); },
  async api(url, opts = {}) {
    const t = this.token();
    if (!t) throw new Error('auth');
    const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + t } });
    if (r.status === 401) { this.signOut(); throw new Error('auth'); }
    if (!r.ok) throw new Error('Drive error ' + r.status + ': ' + (await r.text()).slice(0, 200));
    return r;
  },
  async folder(name, parent) {
    const body = { name, mimeType: 'application/vnd.google-apps.folder' };
    if (parent) body.parents = [parent];
    const r = await this.api('https://www.googleapis.com/drive/v3/files?fields=id', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    return (await r.json()).id;
  },
  async exists(id) {
    try { const r = await this.api('https://www.googleapis.com/drive/v3/files/' + id + '?fields=id,trashed'); const j = await r.json(); return !j.trashed; }
    catch (e) { if (e.message === 'auth') throw e; return false; }
  },
  async upload(blob, name, parent, mime) {
    const init = await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=UTF-8', 'X-Upload-Content-Type': mime },
      body: JSON.stringify({ name, parents: [parent] }),
    });
    const loc = init.headers.get('Location');
    if (!loc) throw new Error('Drive did not return an upload link');
    const r = await fetch(loc, { method: 'PUT', headers: { 'Content-Type': mime }, body: blob });
    if (!r.ok) throw new Error('Upload failed ' + r.status);
    return (await r.json()).id;
  },
  async rootId() {
    const s = Settings.get();
    if (s.rootId && await this.exists(s.rootId)) return s.rootId;
    const id = await this.folder(s.rootName || 'Clean Shell Jobs');
    Settings.set({ rootId: id });
    return id;
  },
  async jobFolders(job) {
    if (job.drive && job.drive.job && await this.exists(job.drive.job)) {
      let changed = false;
      for (const sub of ['Checklist', 'Interior', 'Exterior']) if (!job.drive[sub]) { job.drive[sub] = await this.folder(sub, job.drive.job); changed = true; }
      if (changed) await DB.put('jobs', job);
      return job.drive;
    }
    const root = await this.rootId();
    const d = new Date(job.createdAt);
    const date = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const name = [date, job.customer || 'Customer', job.vehicle].filter(Boolean).join(' – ');
    const jobId = await this.folder(name, root);
    job.drive = { job: jobId };
    for (const sub of ['Checklist', 'Interior', 'Exterior']) job.drive[sub] = await this.folder(sub, jobId);
    await DB.put('jobs', job);
    return job.drive;
  },
  fileName(m, job, all) {
    const ext = (m.mime.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace('quicktime', 'mov').split(';')[0];
    const n = m.kind === 'after' ? (all.find(x => x.id === m.pairId) || {}).n : m.n;
    const nn = String(n || 0).padStart(2, '0');
    const label = m.kind === 'after' ? (all.find(x => x.id === m.pairId) || {}).label : m.label;
    const v = m.kind === 'after' && m.version > 1 ? '-v' + m.version : '';
    return [m.kind, nn, slug(label)].filter(Boolean).join('-') + v + '.' + ext;
  },
  syncing: false,
  async pendingCount() { return (await DB.all('media')).filter(m => !m.driveId).length + (await DB.all('expenses')).filter(e => e.receipt && !e.driveId).length; },
  kick() { if (this.token() && navigator.onLine) this.sync(); else updateSyncBadge(); },
  async sync({ interactive = false } = {}) {
    if (this.syncing) return;
    if (!this.token()) { if (interactive) this.signIn(); else updateSyncBadge(); return; }
    this.syncing = true; updateSyncBadge();
    let done = 0;
    try {
      const jobs = await DB.all('jobs');
      for (const job of jobs) {
        const all = await DB.byJob(job.id);
        const pending = all.filter(m => !m.driveId).sort((a, b) => a.createdAt - b.createdAt);
        if (!pending.length) continue;
        const f = await this.jobFolders(job);
        for (const m of pending) {
          const src = m.kind === 'after' ? (all.find(x => x.id === m.pairId) || m) : m;
          const folder = m.kind === 'checklist' ? f.Checklist : areaOf(src) === 'exterior' ? f.Exterior : f.Interior;
          m.driveId = await this.upload(m.blob, this.fileName(m, job, all), folder, m.mime);
          await DB.put('media', m);
          done++; updateSyncBadge();
        }
      }
      const rcpts = (await DB.all('expenses')).filter(e => e.receipt && !e.driveId);
      if (rcpts.length) {
        let rid = Settings.get().receiptsId;
        if (!rid || !(await this.exists(rid))) { rid = await this.folder('Receipts', await this.rootId()); Settings.set({ receiptsId: rid }); }
        for (const e of rcpts) {
          const ext = ((e.receipt.type || 'image/jpeg').split('/')[1] || 'jpg').replace('jpeg', 'jpg');
          e.driveId = await this.upload(e.receipt, `${e.date}-${slug(e.vendor || e.category)}-${(+e.amount).toFixed(2)}.${ext}`, rid, e.receipt.type || 'image/jpeg');
          await DB.put('expenses', e); done++;
        }
      }
      if (done) toast('Uploaded ' + done + ' to Drive');
      else if (interactive) toast('Everything is already in Drive');
    } catch (e) {
      if (e.message === 'auth') { if (interactive) this.signIn(); else toast('Reconnect Google Drive to keep uploading'); }
      else toast(navigator.onLine ? e.message : 'Offline — will upload when you have signal', 3500);
    } finally {
      this.syncing = false; updateSyncBadge(); if (done) render();
    }
  },
};
async function updateSyncBadge() {
  const n = await Drive.pendingCount();
  const b = $('#syncBtn');
  b.innerHTML = (Drive.syncing ? I('refresh') : I('cloud')) + (n ? '<span class="badge' + (Drive.token() ? '' : ' warn') + '">' + n + '</span>' : '');
  b.classList.toggle('hidden', !n && !Drive.syncing);
  const banner = document.getElementById('driveBanner');
  if (banner) banner.classList.toggle('hidden', !(n && !Drive.token() && !Drive.syncing));

}

const Cam = {
  stream: null, facing: 'environment', mode: 'photo', opts: null, rec: null, chunks: [], recStart: 0, timer: null, count: 0,

    this.chunks = [];

};

function loadImg(blob) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(blob); }); }
function drawCover(ctx, img, x, y, w, h) {
  const s = Math.max(w / img.width, h / img.height), sw = w / s, sh = h / s;
  ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, x, y, w, h);
}
function drawTag(ctx, text, x, y, scale) {
  ctx.font = `700 ${Math.round(30 * scale)}px Inter, -apple-system, system-ui, sans-serif`;
  const pad = 18 * scale, w = ctx.measureText(text).width + pad * 2, h = 56 * scale;
  ctx.fillStyle = 'rgba(7,28,47,.88)';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, h / 2) : ctx.rect(x, y, w, h); ctx.fill();
  ctx.fillStyle = text === 'AFTER' ? '#AFD8FF' : '#F2F4F1';
  ctx.textBaseline = 'middle'; ctx.fillText(text, x + pad, y + h / 2 + 2 * scale);
}
const SIZES = { post: [1080, 1350, 'side'], story: [1080, 1920, 'stack'], google: [1200, 900, 'side'] };
const composeCache = new Map();
async function compose(fmt, before, after) {
  const key = fmt + before.id + after.id;
  if (composeCache.has(key)) return composeCache.get(key);
  try { await document.fonts.load('700 30px Inter'); } catch {}
  const [W, H, lay] = SIZES[fmt];
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#071C2F'; ctx.fillRect(0, 0, W, H);
  const [bi, ai] = await Promise.all([loadImg(previewBlob(before)), loadImg(previewBlob(after))]);
  const gap = 8, sc = W / 1080;
  if (lay === 'side') {
    const w = (W - gap) / 2;
    drawCover(ctx, bi, 0, 0, w, H); drawCover(ctx, ai, w + gap, 0, w, H);
    drawTag(ctx, 'BEFORE', 24 * sc, 24 * sc, sc); drawTag(ctx, 'AFTER', w + gap + 24 * sc, 24 * sc, sc);
  } else {
    const h = (H - gap) / 2;
    drawCover(ctx, bi, 0, 0, W, h); drawCover(ctx, ai, 0, h + gap, W, h);
    drawTag(ctx, 'BEFORE', 32, 140, 1.2); drawTag(ctx, 'AFTER', 32, h + gap + 32, 1.2);
  }
  URL.revokeObjectURL(bi.src); URL.revokeObjectURL(ai.src);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
  composeCache.set(key, blob);
  return blob;
}

}

async function renderDrafts(job, picked, hero) {

      <div class="strip" data-strip="${p.key}" style="display:flex;gap:8px;overflow-x:auto;margin:10px 0;padding-bottom:4px"><div class="sub">Building images…</div></div>
      <textarea class="t" data-cap="${p.key}" style="min-height:${p.key === 'story' || p.key === 'tiktok' ? 70 : 150}px">${esc(d.caption)}</textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost" data-copy="${p.key}">Copy caption</button>
        <button class="btn ${Platform.publisher && NET[p.key] ? 'ghost' : ''}" data-save="${p.key}">Save images</button>
      </div>
      ${Platform.publisher && NET[p.key] ? (d.scheduled
        ? `<div class="sched"><span class="pill done">Scheduled ${esc(fmtWhen(d.scheduled.at))}</span>${d.scheduled.url && /^https:\/\//.test(d.scheduled.url) ? `<a href="${esc(d.scheduled.url)}" target="_blank" rel="noopener">Open in Metricool</a>` : ''}</div>`
        : `<button class="btn block" data-sched="${p.key}" style="margin-top:8px">Schedule to ${NET[p.key]}</button>`) : ''}
      <label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-posted="${p.key}" ${d.posted ? 'checked' : ''}> Posted</label>
    </div>`;
  }).join('');
  const imgsFor = async p => {
    const list = p.key === 'story' || p.fmt === 'google' ? [hero] : picked;
    const out = [];
    for (const [i, pr] of list.entries()) {
      if (!pr) continue;
      const blob = await compose(p.fmt, pr.before, pr.after);
      out.push(new File([blob], `clean-shell-${slug(job.vehicle || 'job')}-${p.key}-${i + 1}.jpg`, { type: 'image/jpeg' }));
    }
    return out;
  };
  box.querySelectorAll('[data-cap]').forEach(t => t.onchange = async () => { job.drafts[t.dataset.cap].caption = t.value; await DB.put('jobs', job); });
  box.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => Platform.copy(box.querySelector(`[data-cap="${b.dataset.copy}"]`).value));
  box.querySelectorAll('[data-posted]').forEach(c => c.onchange = async () => { job.drafts[c.dataset.posted].posted = c.checked; await DB.put('jobs', job); $('#d_' + c.dataset.posted).style.opacity = c.checked ? .6 : 1; });
  box.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const p = PLATFORMS.find(x => x.key === b.dataset.save);
    const files = await imgsFor(p);
    if (await Platform.saveImages(files)) toast(files.length + ' image' + (files.length > 1 ? 's' : '') + ' ready');
  });
  const schedOne = async (key, btn) => {
    const p = PLATFORMS.find(x => x.key === key);
    const when = ($('#c_when') && $('#c_when').value) || toLocalInput(defaultWhen());
    if (new Date(when) < new Date(Date.now() + 2 * 60000)) { toast('Pick a time at least a few minutes from now'); return false; }
    job.when = when;
    if (btn) { btn.disabled = true; btn.textContent = 'Uploading images…'; }
    try {
      const files = await imgsFor(p);
      const caption = box.querySelector(`[data-cap="${key}"]`).value;
      if (btn) btn.textContent = 'Scheduling…';
      const r = await Platform.publisher.schedule(key, files, caption, new Date(when));
      job.drafts[key].scheduled = { at: new Date(when).toISOString(), url: r && r.url };
      await DB.put('jobs', job);
      return true;
    } catch (e) {
      toast((e && e.message) || 'Could not schedule', 4500);
      if (btn) { btn.disabled = false; btn.textContent = 'Try again'; }
      return false;
    }
  };
  box.querySelectorAll('[data-sched]').forEach(b => b.onclick = async () => { if (await schedOne(b.dataset.sched, b)) { toast('Scheduled'); renderClose($('#view'), job.id); } });
  if ($('#c_when')) $('#c_when').onchange = async e => { job.when = e.target.value; await DB.put('jobs', job); };
  if ($('#c_all')) $('#c_all').onclick = async e => {
    const keys = PLATFORMS.filter(p => NET[p.key] && !job.drafts[p.key].scheduled && !job.drafts[p.key].posted).map(p => p.key);

  };
  for (const p of PLATFORMS) {
    const files = await imgsFor(p);
    const strip = box.querySelector(`[data-strip="${p.key}"]`);
    if (!strip) return;
    const [W, H] = SIZES[p.fmt];

  }

const SIZES_V = { S: 'Small', M: 'Medium', L: 'Large' };
const DEFAULT_CATALOG = [
  ['Basic Package', { S: 216, M: 253, L: 286 }], ['Premium Package', { S: 336, M: 383, L: 436 }],
  ['Basic Interior'], ['Basic Exterior'], ['Premium Interior'], ['Premium Exterior'],
  ['Restorative Package'], ['Interior Restorative'], ['Exterior Restorative'],
  ['Odor Removal (Biosweep)'], ['Mold Removal'], ['Engine Bay Detail'], ['Headlight Restoration'],
  ['C2 Ceramic Sealant'], ['Exo V5 Ceramic Coating'], ['Crystal Serum Light Ceramic Coating'], ['Crystal Serum Light + Exo V5 Ceramic Coating'],
  ['Halo V2 Film Ceramic Coating'], ['Windshield Glass Ceramic Coating'], ['Side Glass Ceramic Coating'], ['Wheel Face Ceramic Coating'],
  ['Trim Protection'], ['Trim Restoration'], ['Dashboard/Plastic Protection'], ['Carpet/Fabric Protection'], ['Leather Protection'],
  ['Paint Chip Repair'], ['Adhesive Removal'],
].map(([name, prices], i) => ({ id: 'svc' + i, name, prices: prices || null, price: null }));
const Catalog = {
  get() { try { const c = JSON.parse(localStorage.getItem('cs_catalog') || 'null'); if (Array.isArray(c) && c.length) return c; } catch {} return DEFAULT_CATALOG.map(x => ({ ...x })); },
  set(c) { try { localStorage.setItem('cs_catalog', JSON.stringify(c)); } catch {} },
};
const PAY_METHODS = ['Card', 'Cash', 'Zelle', 'Venmo', 'Cash App', 'Check', 'Square', 'Other'];
const money = n => { n = Math.round((+n || 0) * 100) / 100; return '$' + n.toLocaleString(undefined, { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
const digits = s => String(s || '').replace(/\D/g, '').slice(-10);
const DAY = 86400000;
function jobDate(j) { return j.date ? new Date(j.date + 'T12:00:00').getTime() : j.createdAt; }
function fmtDate(t) { return new Date(t).toLocaleDateString([], { month: 'short', day: 'numeric', year: new Date(t).getFullYear() === new Date().getFullYear() ? undefined : 'numeric' }); }
function jobTotal(j) {
  const items = j.items || [];
  let sub = items.reduce((a, i) => a + (+i.price || 0) * (+i.qty || 1), 0);
  if (!items.length && j.price) sub = parseFloat(String(j.price).replace(/[^0-9.]/g, '')) || 0;
  const disc = +j.discount || 0, rate = +(Settings.get().taxRate || 0);
  const tax = Math.max(0, sub - disc) * rate / 100;
  return { sub, disc, tax, total: Math.max(0, sub - disc + tax) };
}
function billStatus(j) { return (j.billing && j.billing.status) || (j.items && j.items.length ? 'quote' : 'none'); }
function billPill(j) {
  const s = billStatus(j), t = jobTotal(j).total;
  if (s === 'paid') return `<span class="pill done">Paid ${money(j.billing.amount ?? t)}</span>`;
  if (s === 'invoiced') return `<span class="pill warn">Unpaid ${money(t)}</span>`;
  if (s === 'quote' && t && j.approval) return `<span class="pill done">Approved ${money(t)}</span>`;
  if (s === 'quote' && t) return `<span class="pill">Quote ${money(t)}</span>`;
  return '';
}

async function linkCustomer(job) {
  const all = await DB.all('customers');
  let c = job.customerId && all.find(x => x.id === job.customerId);
  if (!c && digits(job.phone).length >= 7) c = all.find(x => digits(x.phone) === digits(job.phone));
  if (!c && job.customer) c = all.find(x => (x.name || '').trim().toLowerCase() === job.customer.trim().toLowerCase());
  if (!c) {
    if (!job.customer && !job.phone) return null;
    c = { id: uid(), createdAt: Date.now(), name: job.customer || '', phone: job.phone || '', email: job.email || '', address: job.address || '', city: job.city || '', interval: 0, notes: '', referral: job.source === 'online booking' ? 'Online booking' : '' };
  } else {
    for (const k of ['phone', 'email', 'address', 'city']) if (job[k] && !c[k]) c[k] = job[k];
    if (job.customer) c.name = job.customer;
  }
  await DB.put('customers', c);
  if (job.customerId !== c.id) { job.customerId = c.id; await DB.put('jobs', job); }
  return c;
}
async function ensureCustomers() { for (const j of await DB.all('jobs')) if (!j.customerId && (j.customer || j.phone)) await linkCustomer(j); }
function custJobs(c, jobs) { return jobs.filter(j => j.customerId === c.id).sort((a, b) => jobDate(b) - jobDate(a)); }
function nextDue(c, jobs) { if (!c.interval) return null; const mine = custJobs(c, jobs); return mine.length ? jobDate(mine[0]) + c.interval * 7 * DAY : null; }
function reminderText(c, jobs) {
  const last = custJobs(c, jobs)[0], first = (c.name || '').split(' ')[0] || 'there', b = Biz.get();
  const wk = last ? Math.max(1, Math.round((Date.now() - jobDate(last)) / (7 * DAY))) : null;
  return `Hi ${first}, it's Clean Shell Detailing! ${wk ? `It's been about ${wk} week${wk > 1 ? 's' : ''} since we did your ${last.vehicle || 'vehicle'}.` : ''} Want me to get you on the schedule for a maintenance detail? Book at ${b.link} or just reply here. Thanks!`.replace('  ', ' ');
}

function docText(job, kind) {
  const t = jobTotal(job), b = Biz.get(), pay = Settings.get().payLink;
  const lines = (job.items || []).map(i => `• ${i.name}${(+i.qty || 1) > 1 ? ' ×' + i.qty : ''}: ${money((+i.price || 0) * (+i.qty || 1))}`);
  return [`Clean Shell Detailing · ${kind === 'invoice' ? 'Invoice' : 'Quote'}`,
    [job.customer, job.vehicle, fmtDate(jobDate(job))].filter(Boolean).join(' · '), '',
    ...lines, '',
    t.disc ? `Discount: -${money(t.disc)}` : '', t.tax ? `Tax: ${money(t.tax)}` : '',
    `Total: ${money(t.total)}`, depositPaid(job) && kind === 'invoice' ? `Deposit paid: -${money(depositPaid(job))}\nBalance due: ${money(balanceDue(job))}` : '', '',
    kind === 'invoice' && pay ? `Pay here: ${pay}` : '',
    kind === 'invoice' ? 'Thank you for choosing Clean Shell!' : 'Reply to approve and I\'ll get you scheduled.',
    `${b.phone} · ${b.link}`].filter((l, i, a) => l !== '' || a[i - 1] !== '').join('\n').trim();
}
async function docImage(job, kind) {
  try { await document.fonts.load('700 40px Inter'); } catch {}
  const items = job.items || [], t = jobTotal(job), b = Biz.get(), pay = Settings.get().payLink;
  const W = 1080, rowH = 74, H = 640 + items.length * rowH + (t.disc ? 60 : 0) + (t.tax ? 60 : 0) + (kind === 'invoice' && pay ? 80 : 0);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const F = (w, s) => `${w} ${s}px Inter, -apple-system, system-ui, sans-serif`;
  x.fillStyle = '#F2F4F1'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#071C2F'; x.fillRect(0, 0, W, 230);
  x.fillStyle = '#F2F4F1'; x.font = F(700, 46); x.fillText('Clean Shell Detailing', 64, 100);
  x.fillStyle = '#AFD8FF'; x.font = F(500, 28); x.fillText(`${b.phone}  ·  ${b.link}`, 64, 150);
  x.textAlign = 'right'; x.fillStyle = '#F2F4F1'; x.font = F(700, 34); x.fillText(kind === 'invoice' ? 'INVOICE' : 'QUOTE', W - 64, 100);
  x.fillStyle = '#AFD8FF'; x.font = F(500, 26); x.fillText(fmtDate(jobDate(job)), W - 64, 150);
  x.textAlign = 'left'; x.fillStyle = '#071C2F'; x.font = F(700, 34); x.fillText(job.customer || 'Customer', 64, 310);
  x.fillStyle = '#4A5866'; x.font = F(500, 28); x.fillText([job.vehicle, job.city].filter(Boolean).join(' · '), 64, 356);
  let y = 430; x.strokeStyle = '#D9DED6'; x.lineWidth = 2;
  for (const i of items) {
    x.fillStyle = '#071C2F'; x.font = F(500, 30); x.textAlign = 'left';
    x.fillText(i.name + ((+i.qty || 1) > 1 ? ` ×${i.qty}` : ''), 64, y);
    x.textAlign = 'right'; x.fillText(money((+i.price || 0) * (+i.qty || 1)), W - 64, y);
    x.beginPath(); x.moveTo(64, y + 26); x.lineTo(W - 64, y + 26); x.stroke(); y += rowH;
  }
  const line = (label, val, bold) => { x.textAlign = 'left'; x.fillStyle = bold ? '#071C2F' : '#4A5866'; x.font = F(bold ? 700 : 500, bold ? 40 : 28); x.fillText(label, 64, y); x.textAlign = 'right'; x.fillText(val, W - 64, y); y += bold ? 70 : 54; };
  y += 20;
  if (t.disc) line('Discount', '-' + money(t.disc));
  if (t.tax) line('Tax', money(t.tax));
  line('Total', money(t.total), true);
  if (kind === 'invoice' && pay) { x.textAlign = 'left'; x.fillStyle = '#071C2F'; x.font = F(600, 28); x.fillText('Pay: ' + pay, 64, y); y += 60; }
  x.textAlign = 'center'; x.fillStyle = '#68A482'; x.font = F(600, 26); x.fillText(kind === 'invoice' ? 'Thank you for choosing Clean Shell!' : 'Reply to approve and I\'ll get you scheduled.', W / 2, H - 50);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  return new File([blob], `clean-shell-${kind}-${slug(job.customer || 'job')}.png`, { type: 'image/png' });
}

function bindQuote(v, job) {
  const save = async () => { syncOpt(job); job.services = (job.items || []).map(i => i.name).join(' + ') || job.services; await DB.put('jobs', job); };
  const rerender = () => { const card = $('#quoteCard'); if (card) { card.outerHTML = quoteCardHtml(job); bindQuote(v, job); } };
  v.querySelectorAll('[data-size]').forEach(b => b.onclick = async () => {
    job.size = b.dataset.size; const cat = Catalog.get();
    for (const i of job.items || []) { const c = cat.find(x => x.id === i.svc); if (c && c.prices && c.prices[job.size] != null) i.price = c.prices[job.size]; }
    await save(); rerender();
  });
  v.querySelectorAll('[data-iname]').forEach(i => i.onchange = async () => { job.items[+i.dataset.iname].name = i.value.trim(); await save(); });
  v.querySelectorAll('[data-iprice]').forEach(i => i.onchange = async () => { job.items[+i.dataset.iprice].price = parseFloat(i.value.replace(/[^0-9.]/g, '')) || 0; await save(); rerender(); });
  v.querySelectorAll('[data-idel]').forEach(b => b.onclick = async () => { job.items.splice(+b.dataset.idel, 1); await save(); rerender(); });
  if ($('#q_add')) $('#q_add').onchange = async e => {
    const id = e.target.value; if (!id) return;
    job.items = job.items || [];
    if (id === '__custom') job.items.push({ name: 'Custom item', price: 0, qty: 1 });
    else { const c = Catalog.get().find(x => x.id === id); const size = job.size || 'M'; job.items.push({ svc: c.id, name: c.prices ? `${c.name} (${SIZES_V[size]})` : c.name, price: c.prices ? c.prices[size] ?? 0 : c.price ?? 0, qty: 1 }); }
    if (!job.billing) job.billing = { status: 'quote' };
    await save(); rerender();
  };
  if ($('#q_disc')) $('#q_disc').onchange = async e => { job.discount = parseFloat(e.target.value.replace(/[^0-9.]/g, '')) || 0; await save(); rerender(); };
  v.querySelectorAll('[data-doc]').forEach(b => b.onclick = () => openDoc(job, b.dataset.doc));
  v.querySelectorAll('[data-opt]').forEach(b => b.onclick = async () => { ensureOpts(job); switchOpt(job, +b.dataset.opt); await save(); rerender(); });
  const oa = v.querySelector('[data-optadd]'); if (oa) oa.onclick = async () => { ensureOpts(job); syncOpt(job); const n = job.opts.length; job.opts.push({ label: ['Good', 'Better', 'Best'][n] || 'Option ' + (n + 1), items: [], discount: 0 }); switchOpt(job, n); await save(); rerender(); };
  if ($('#q_olabel')) $('#q_olabel').onchange = async e => { job.opts[job.optIdx || 0].label = e.target.value.trim() || 'Option'; await save(); rerender(); };
  if ($('#q_odel')) $('#q_odel').onclick = async () => { const i = job.optIdx || 0; job.opts.splice(i, 1); job.optIdx = 0; job.items = job.opts[0].items; job.discount = job.opts[0].discount || 0; if (job.opts.length === 1) delete job.opts; await DB.put('jobs', job); rerender(); };
  if ($('#q_dep')) $('#q_dep').onchange = async e => { const n = parseFloat(e.target.value.replace(/[^0-9.]/g, '')); job.depositAmt = isNaN(n) ? null : n; await save(); rerender(); };
  if ($('#q_deppaid')) $('#q_deppaid').onclick = async () => { job.deposit = { amount: depositDue(job), method: ($('#q_method') && $('#q_method').value) || '', paidAt: Date.now() }; await save(); toast('Deposit recorded'); rerender(); };
  if ($('#q_send')) $('#q_send').onclick = async () => { await save(); shareWithCustomer(job, 'quote'); };
  if ($('#q_sign')) $('#q_sign').onclick = () => signatureSheet(job, rerender);
  if ($('#q_inv')) $('#q_inv').onclick = async () => { if (Server.on()) { if (billStatus(job) !== 'paid') job.billing = { ...(job.billing || {}), status: 'invoiced', sentAt: Date.now() }; await save(); shareWithCustomer(job, 'invoice'); } else openDoc(job, 'invoice'); };
  if ($('#q_paid')) $('#q_paid').onclick = async () => {
    job.billing = { status: 'paid', method: $('#q_method').value, paidAt: Date.now(), amount: jobTotal(job).total };
    await save(); toast('Marked paid'); rerender();
  };
  if ($('#q_unpay')) $('#q_unpay').onclick = async () => { job.billing = { status: 'invoiced' }; await save(); rerender(); };
}

async function openDoc(job, kind) {
  if (kind === 'invoice' && billStatus(job) !== 'paid') { job.billing = { ...(job.billing || {}), status: 'invoiced', sentAt: Date.now() }; await DB.put('jobs', job); }
  const text = docText(job, kind);
  const st = $('#vStage'); st.onpointerdown = null;
  $('#vTitle').textContent = (kind === 'invoice' ? 'Invoice' : 'Quote') + ' · ' + (job.customer || '');
  const file = await docImage(job, kind);
  st.innerHTML = `<img src="${URL.createObjectURL(file)}" alt="${kind}">`;
  const acts = $('#vActions'); acts.innerHTML = '';
  const add = (label, cls, fn) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = label; b.onclick = fn; acts.appendChild(b); };
  add('Copy as text', 'ghost', () => Platform.copy(text));
  add('Save image', '', async () => { if (await Platform.saveImages([file])) toast('Saved'); });
  $('#viewer').classList.add('on');
  const card = $('#quoteCard'); if (card && currentJob && currentJob.id === job.id) { card.outerHTML = quoteCardHtml(job); bindQuote($('#view'), job); }
}

async function renderMoney(v) {

  const members = (await DB.all('customers')).filter(c => c.membership && c.membership.active);
  const mExp = (await DB.all('expenses')).filter(e => monthKey(e.date) === monthKey(dayKey(now))).reduce((a, e) => a + expAmt(e), 0);
  const unpaid = jobs.filter(j => billStatus(j) === 'invoiced' || (j.status === 'Done' && billStatus(j) !== 'paid' && jobTotal(j).total));
  const unpaidSum = unpaid.reduce((a, j) => a + jobTotal(j).total, 0);
  const months = [...Array(6)].map((_, i) => { const d = new Date(now.getFullYear(), now.getMonth() - 5 + i, 1); const e = new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime(); return { label: d.toLocaleDateString([], { month: 'short' }), sum: paid.filter(p => p.at >= d.getTime() && p.at < e).reduce((a, p) => a + p.amt, 0) }; });
  const max = Math.max(1, ...months.map(m => m.sum));

    <div class="kpi"><span>Expenses</span><b>${money(mExp)}</b><small>this month</small></div>
    <div class="kpi"><span>Profit</span><b>${money(monthSum - mExp)}</b><small>this month, before mileage</small></div>
    <div class="kpi"><span>Members</span><b>${members.length}</b><small>${money(members.reduce((a, c) => a + monthlyValue(c.membership.price ?? (Plans.get().find(p => p.id === c.membership.planId) || {}).price, (Plans.get().find(p => p.id === c.membership.planId) || {}).weeks), 0))}/mo recurring</small></div>
    <div class="kpi"><span>All time</span><b>${money(paid.reduce((a, p) => a + p.amt, 0))}</b><small>${paid.length} paid</small></div>
  </div>
  <a class="btn ghost block" style="text-decoration:none;margin-bottom:14px" href="#/expenses">${I('dollar')}Expenses &amp; mileage</a>
  <div class="card"><h2>Last 6 months</h2><div class="bars">${months.map(m => `<div class="bar"><span>${m.label}</span><i style="width:${(m.sum / max * 100).toFixed(1)}%"></i><b>${m.sum ? money(m.sum) : ''}</b></div>`).join('')}</div></div>
  <div class="card"><h2>Waiting on payment<span class="count">${money(unpaidSum)}</span></h2>${unpaid.length ? unpaid.map(j => `<a class="hist" href="#/job/${j.id}"><span><b>${esc(j.customer || 'Customer')}</b><span class="sub">${esc(j.vehicle || '')} · ${fmtDate(jobDate(j))}</span></span><span class="pill warn">${money(jobTotal(j).total)}</span></a>`).join('') : '<div class="sub">Nothing outstanding.</div>'}</div>
  ${top.length ? `<div class="card"><h2>Top services</h2>${top.map(([n, s]) => `<div class="hist"><span>${esc(n)}</span><b>${money(s)}</b></div>`).join('')}</div>` : ''}
  <a class="btn ghost block" style="text-decoration:none" href="#/services">Services, prices &amp; settings</a>`;
}

function fillMsg(tpl, job, eta, link) {
  const s = Settings.get(), t = jobTotal(job), lk = link || job.portalLink || '';

const Sms = {
  cache: {}, number: null,
  available: true, // the demo turns this off
  on() { const s = Settings.get(); return this.available && !!s.smsOn && !!s.smsKey; },
  async api(path, opts = {}) {
    let r;
    try { r = await fetch('/api/' + path, { ...opts, headers: { 'content-type': 'application/json', 'x-app-key': Settings.get().smsKey || '', ...(opts.headers || {}) } }); }
    catch { throw new Error(navigator.onLine ? 'Could not reach the texting server' : 'No signal. Try again when you\'re back online'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Texting server error ' + r.status);
    return j;
  },
  send(to, body) { return this.api('sms-send', { method: 'POST', body: JSON.stringify({ to, body }) }); },
  thread(phone) { return this.api('sms-threads?phone=' + encodeURIComponent(digits(phone))); },
  async threads() { const j = await this.api('sms-threads'); this.cache = j.threads || {}; this.number = j.number; return this.cache; },
  readMap() { try { return JSON.parse(localStorage.getItem('cs_read') || '{}'); } catch { return {}; } },
  markRead(d) { const r = this.readMap(); r[d] = Date.now(); try { localStorage.setItem('cs_read', JSON.stringify(r)); } catch {} updateTextBadge(); },
  unread() { const r = this.readMap(); return Object.entries(this.cache).filter(([d, t]) => t.lastInAt && t.lastInAt > (r[d] || 0)); },
};
function updateTextBadge() {
  const a = document.querySelector('#tabs [data-tab="messages"]'); if (!a) return;
  let b = a.querySelector('.tbadge'); const n = Sms.on() ? Sms.unread().length : 0;
  if (!n) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('span'); b.className = 'tbadge'; a.appendChild(b); }
  b.textContent = n;
}
async function pollTexts() { if (!Sms.on() || document.hidden) return; try { await Sms.threads(); updateTextBadge(); } catch {} }
setInterval(pollTexts, 30000);
document.addEventListener('visibilitychange', pollTexts);

const GEO_BIAS = { lat: 34.237, lon: -84.491 };
async function geoSearch(q, signal) {
  const r = await fetch('https://photon.komoot.io/api/?' + new URLSearchParams({ q, limit: '10', lang: 'en', lat: GEO_BIAS.lat, lon: GEO_BIAS.lon }), { signal });

function addrAuto(inp, cityInp) {

  const note = document.createElement('div'); note.className = 'ac-note hidden';
  inp.after(box); box.after(note);

    }, 300);

async function importClients(data) {

  let added = 0, skipped = 0;
  for (const r of rows) {
    const name = String(r.name || '').replace(/\s+/g, ' ').trim(); if (!name) continue;
    const k = [r.sourceId && 'id:' + r.sourceId, digits(r.phone) && 'ph:' + digits(r.phone), r.email && 'em:' + String(r.email).toLowerCase(), 'nm:' + name.toLowerCase()].filter(Boolean);
    if (k.some(x => keys.has(x))) { skipped++; continue; }
    const s = v => String(v || '').trim();
    await DB.put('customers', { id: uid(), createdAt: +new Date(r.createdAt) || Date.now(), name, phone: s(r.phone), email: s(r.email), address: s(r.address), city: s(r.city), vehicle: s(r.vehicle), referral: s(r.referral), notes: s(r.notes), interval: 0, sourceId: s(r.sourceId) });
    k.forEach(x => keys.add(x)); added++;

    const custs = await DB.all('customers'), bySrc = Object.fromEntries(custs.filter(c => c.sourceId).map(c => [c.sourceId, c]));
    const haveJobs = new Set((await DB.all('jobs')).map(j => j.sourceId).filter(Boolean));
    for (const r of data.jobs) {
      if (!r.sourceId || haveJobs.has(r.sourceId) || (data.removeJobs || []).includes(r.sourceId)) { jobsSkipped++; continue; }
      const c = bySrc[r.clientSourceId] || {}, s = v => String(v || '').trim();
      const j = { id: uid(), createdAt: Date.now(), sourceId: r.sourceId, status: r.status || 'Done', date: s(r.date), time: s(r.time) || '09:00', duration: +r.duration || 3, size: 'M',
        customerId: c.id || '', customer: c.name || s(r.customer), phone: c.phone || '', email: c.email || '', address: c.address || '', city: c.city || '', vehicle: s(r.vehicle), services: s(r.services), notes: s(r.notes),
        items: (r.items || []).map(i => ({ name: s(i.name) || 'Service', price: +i.price || 0, qty: +i.qty || 1 })) };
      if (r.paid) j.billing = { status: 'paid', method: s(r.method) || 'Other', paidAt: +new Date(r.date + 'T12:00:00'), amount: +r.amount || 0 };

}

function dragScroll(el) {
  if (!el) return;
  let x0 = null, s0 = 0, moved = false;
  el.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { el.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; x0 = e.clientX; s0 = el.scrollLeft; moved = false; });
  el.addEventListener('pointermove', e => { if (x0 == null) return; const d = e.clientX - x0; if (Math.abs(d) > 4) moved = true; el.scrollLeft = s0 - d; });
  addEventListener('pointerup', () => { x0 = null; });
  el.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  const on = el.querySelector('.chip.on'); if (on && on.offsetLeft + on.offsetWidth > el.clientWidth) el.scrollLeft = on.offsetLeft - 14;
}

const randToken = () => { const a = new Uint8Array(18); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };

// ---- quote options (Good / Better / Best) ----
function ensureOpts(job) { if (!job.opts) { job.opts = [{ label: optLabelGuess(job.items) || 'Option 1', items: job.items || [], discount: +job.discount || 0 }]; job.optIdx = 0; } }
function optLabelGuess(items) { const n = (items || [])[0] && items[0].name; return n ? n.replace(/ \((Small|Medium|Large)\)$/, '').replace(/ Package$/, '') : ''; }
function syncOpt(job) { if (job.opts) { const o = job.opts[job.optIdx || 0]; if (o) { o.items = job.items || []; o.discount = +job.discount || 0; } } }
function switchOpt(job, i) { syncOpt(job); job.optIdx = i; job.items = job.opts[i].items || []; job.discount = job.opts[i].discount || 0; }
function optTotal(job, o) { return jobTotal({ items: o.items || [], discount: o.discount || 0 }).total; }

// ---- deposits ----
function depositDue(job) {
  if (job.depositAmt != null) return +job.depositAmt || 0;
  const s = Settings.get(), pct = s.depositPct ?? 25, min = s.depositMin ?? 300, t = jobTotal(job).total;
  return t >= min && pct > 0 ? Math.round(t * pct / 100) : 0;
}
const depositPaid = job => (job.deposit && +job.deposit.amount) || 0;
const balanceDue = job => Math.max(0, jobTotal(job).total - depositPaid(job));

function applyApproval(job, option, name, sig, via) {
  if (job.opts && job.opts.length > 1 && option != null && job.opts[option]) switchOpt(job, option);
  job.approval = { at: Date.now(), option: job.optIdx || 0, name: name || job.customer || '', sig: sig || '', via: via || 'link' };
  job.billing = { ...(job.billing || {}), status: billStatus(job) === 'paid' ? 'paid' : 'quote' };
  job.services = (job.items || []).map(i => i.name).join(' + ') || job.services;
}

function signatureSheet(job, onDone) {
  const sheet = $('#sheet');

    <div class="sheet-head"><b>Approve ${esc(job.opts && job.opts.length > 1 ? job.opts[job.optIdx || 0].label : 'quote')} · ${money(jobTotal(job).total)}</b><button class="x" id="sg_x" aria-label="Close" style="background:#E3E7E2;color:#5C6B7A">${I('x')}</button></div>

async function downscale(blob, max = 1600) {
  try {
    const img = await loadImg(blob); const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  } catch { return blob; }
}
