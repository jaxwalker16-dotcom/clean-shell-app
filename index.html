const FU_DEFAULT = { remind: true, quotefu: true, payfu: true, review: true };
const fuOn = k => ({ ...FU_DEFAULT, ...(Settings.get().fu || {}) })[k];
function sentKind(job, k) { return (job.msgLog || []).some(l => l.k === k && (k !== 'remind' || l.date === job.date)); }
function computeFollowups(jobs) {
  const out = [], now = Date.now(), M = Msgs.get();
  const at = (date, hh) => { const d = new Date(date + 'T00:00:00'); d.setHours(hh, 0, 0, 0); return d.getTime(); };
  for (const j of jobs) {
    if (!digits(j.phone) || digits(j.phone).length !== 10) continue;
    const st = billStatus(j), add = (k, t) => { if (fuOn(k) && !sentKind(j, k)) out.push({ id: `${j.id}:${k}:${k === 'remind' ? j.date : ''}`, jobId: j.id, k, at: t, to: j.phone, body: fillMsg(M[k].text, j) }); };
    if (j.date && j.time && j.status !== 'Done' && ['Scheduled', 'On the way'].includes(j.status)) { const t = at(j.date, 0) - 6 * 3600000; if (t > now - 3600000) add('remind', t); }
    if (j.quoteSentAt && !j.approval && st === 'quote') add('quotefu', j.quoteSentAt + 2 * DAY);
    if (st === 'invoiced' && j.billing.sentAt) add('payfu', j.billing.sentAt + 3 * DAY);
    if (st === 'paid' && j.billing.paidAt && j.billing.paidAt > now - 14 * DAY) add('review', at(dayKey(new Date(j.billing.paidAt + DAY)), 10));
  }
  return out.sort((a, b) => a.at - b.at);
}
let fuTimer = null;
function queueFollowupSync() { clearTimeout(fuTimer); fuTimer = setTimeout(syncFollowups, 1500); }
async function syncFollowups() {
  if (!Sms.on()) return;
  try { const items = computeFollowups(await DB.all('jobs')).filter(i => i.at > Date.now() - 2 * DAY); await Server.api('followups-sync', { method: 'POST', body: JSON.stringify({ items }) }); } catch {}
}

async function pollInbox() {
  if (!Server.on() || document.hidden) return;
  let evs; try { evs = (await Server.api('portal-inbox')).events || []; } catch { return; }
  if (!evs.length) return;
  const reqs = Requests.get(), done = [];
  for (const ev of evs) {
    if (ev.type === 'approve') {
      const j = await DB.get('jobs', ev.jobId);
      if (j) { applyApproval(j, ev.option, ev.name, ev.signature, 'link'); await DB.put('jobs', j); toast(`${(ev.name || j.customer || 'Customer').split(' ')[0]} approved ${money(jobTotal(j).total)}`, 4000); }
    } else if (ev.type === 'booking' || ev.type === 'message') { if (!reqs.some(r => r.id === ev.id)) reqs.unshift(ev); }
    else if (ev.type === 'followup-sent' || ev.type === 'followup-failed') {
      const j = await DB.get('jobs', ev.jobId);
      if (j && ev.type === 'followup-sent') { j.msgLog = [...(j.msgLog || []), { k: ev.k, at: ev.at, auto: true, date: j.date }]; await DB.put('jobs', j); }
      if (ev.type === 'followup-failed') toast('A follow-up text failed: ' + (ev.error || ''), 4000);
    }
    done.push(ev.id);
  }
  Requests.set(reqs.slice(0, 50));
  try { await Server.api('portal-inbox', { method: 'POST', body: JSON.stringify({ ids: done }) }); } catch {}
  if (['#/', ''].includes(typeof ROUTE !== 'undefined' ? ROUTE : location.hash)) render();
}

  document.querySelector('header.top').classList.toggle('large', !back); $('#title').textContent = title; $('#backBtn').classList.toggle('hidden', !back); $('#backBtn').onclick = () => { nav(back); }; }

async function render() {
  const h = ROUTE;
  const v = $('#view');
  document.querySelectorAll('.fab').forEach(f => f.remove());
  tabbar(null); headerAdd(null);
  if (h.startsWith('#/chat/')) return renderChat(v, h.split('/')[2]);
  if (h === '#/customers') return renderCustomers(v);
  if (h.startsWith('#/customer/')) return renderCustomer(v, h.split('/')[2]);
  if (h === '#/money') return renderMoney(v);
  if (h === '#/services') return renderServices(v);
  if (h.startsWith('#/new/')) return renderEdit(v, null, h.split('/')[2]);
  if (h === '#/schedule') return renderSchedule(v);
  if (h === '#/messages') return renderMessages(v);
  if (h === '#/products') return renderProducts(v);
  if (h.startsWith('#/product/')) return renderProduct(v, h.split('/')[2]);
  if (h === '#/expenses') return renderExpenses(v);
  if (h.startsWith('#/book/')) return renderEdit(v, null, null, h.split('/')[2]);
  if (h.startsWith('#/job/')) return renderJob(v, h.split('/')[2]);
  if (h.startsWith('#/edit/')) return renderEdit(v, h.split('/')[2]);
  if (h === '#/new') return renderEdit(v, null);
  if (h.startsWith('#/close/')) return renderClose(v, h.split('/')[2]);
  if (h === '#/settings') return renderSettings(v);
  return renderList(v);
}

function driveBannerHtml() {
  return `<div class="banner hidden" id="driveBanner"><span style="flex:1"><b id="bannerCount">0</b> waiting to upload to Drive</span><button class="btn" onclick="Drive.sync({interactive:true})">Connect Drive</button></div>`;
}

async function renderList(v) {
  currentJob = null;
  setHeader('Jobs', null); tabbar('jobs');
  await ensureCustomers();
  const jobs = (await DB.all('jobs')).sort((a, b) => jobDate(b) - jobDate(a) || String(a.time || '').localeCompare(String(b.time || '')) || b.createdAt - a.createdAt);
  const media = await DB.all('media');
  const due = await dueList();
  const todayK = dayKey(new Date()), yK = dayKey(new Date(Date.now() - DAY)), tK = dayKey(new Date(Date.now() + DAY));
  const dayLabel = k => k === todayK ? 'Today' : k === yK ? 'Yesterday' : k === tK ? 'Tomorrow' : new Date(k + 'T12:00:00').toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  const groups = []; for (const j of jobs) { const k = j.date || dayKey(new Date(j.createdAt)); const g = groups.find(x => x.k === k); if (g) g.list.push(j); else groups.push({ k, list: [j] }); }
  const row = j => {
    const mine = media.filter(m => m.jobId === j.id), photos = mine.filter(m => m.kind !== 'checklist').length;
    return `<a class="lrow" href="#/job/${j.id}"><span class="lmain"><b>${esc(j.customer || 'New customer')}</b><span class="sub">${esc([j.vehicle, j.services].filter(Boolean).join(' · ') || '—')}</span></span>
      <span class="lside">${j.time ? `<span class="ltime">${fmtTime(jobStart(j))}</span>` : ''}<span class="ltags">${billPill(j) || `<span class="pill ${j.status === 'Done' ? 'done' : 'muted'}">${esc(j.status)}</span>`}${photos ? `<span class="lcount">${I('camera')}${photos}</span>` : ''}</span></span>
      <span class="chev">${I('chev')}</span></a>`;
  };
  const custName = id => (jobs.find(j => j.id === id) || {}).customer || '';
  const fuDue = Sms.on() ? [] : computeFollowups(jobs).filter(i => i.at <= Date.now()).map(i => ({ ...i, cust: custName(i.jobId) }));
  v.innerHTML = driveBannerHtml() + requestsHtml() + followupsDueHtml(fuDue) + upNextHtml(jobs) + dueCardHtml(due) + (jobs.length
    ? groups.map(g => `<div class="section-h">${esc(dayLabel(g.k))}</div><div class="group">${g.list.map(row).join('')}</div>`).join('')
    : `<div class="empty"><span class="ring">${I('car')}</span><p><b>No jobs yet</b></p></div>`);
  headerAdd('#/new', 'New job');
  bindAgenda(v, jobs);
  v.querySelectorAll('[data-rqok]').forEach(b => b.onclick = () => acceptBooking(Requests.get().find(r => r.id === b.dataset.rqok)));
  v.querySelectorAll('[data-rqx]').forEach(b => b.onclick = () => { Requests.set(Requests.get().filter(r => r.id !== b.dataset.rqx)); renderList(v); });
  v.querySelectorAll('[data-fusend]').forEach(b => b.onclick = () => { const i = fuDue.find(x => x.id === b.dataset.fusend), j = jobs.find(x => x.id === i.jobId); openComposer(j, i.k, i.body); });
  v.querySelectorAll('[data-fuskip]').forEach(b => b.onclick = async () => { const i = fuDue.find(x => x.id === b.dataset.fuskip), j = jobs.find(x => x.id === i.jobId); j.msgLog = [...(j.msgLog || []), { k: i.k, at: Date.now(), skipped: true, date: j.date }]; await DB.put('jobs', j); renderList(v); });
  v.querySelectorAll('[data-remind]').forEach(b => b.onclick = () => { const x = due.find(d => d.c.id === b.dataset.remind); if (x) Platform.copy(reminderText(x.c, x.jobs)); });
  updateSyncBadge();
}

async function renderEdit(v, id, custId, bookDate) {
  const today = toLocalInput(new Date()).slice(0, 10);
  const j = id ? await DB.get('jobs', id) : { id: uid(), createdAt: Date.now(), status: bookDate && bookDate > today ? 'Scheduled' : 'Arrived', date: bookDate || today, time: bookDate ? '09:00' : toLocalInput(new Date()).slice(11, 16), duration: 3, size: 'M' };
  const allJobs = await DB.all('jobs');
  if (!id && custId) { const c = await DB.get('customers', custId); if (c) { Object.assign(j, { customerId: c.id, customer: c.name, phone: c.phone, email: c.email, address: c.address, city: c.city, vehicle: c.vehicle || '', status: 'Scheduled' });
    const plan = c.membership && c.membership.active && Plans.get().find(p => p.id === c.membership.planId);
    if (plan) { j.items = [{ name: plan.name + ' visit', price: c.membership.price ?? plan.price ?? 0, qty: 1 }]; j.billing = { status: 'quote' }; j.services = plan.name; j.member = true; } } }
  const knownCustomers = await DB.all('customers');
  setHeader(id ? 'Edit job' : bookDate ? 'Book a job' : 'New job', id ? '#/job/' + id : bookDate ? '#/schedule' : custId ? '#/customer/' + custId : '#/');
  const f = (k, label, type = 'text', ph = '') => `<label class="f" for="f_${k}">${label}</label><input class="t" id="f_${k}" type="${type}" placeholder="${ph}" value="${esc(j[k])}">`;
  v.innerHTML = `<div class="card">
    ${f('customer', 'Customer name', 'text', 'e.g. Sarah Miller')}
    <datalist id="custList">${knownCustomers.map(c => `<option value="${esc(c.name)}">`).join('')}</datalist>
    ${f('phone', 'Phone', 'tel', '(555) 555-5555')}
    ${f('email', 'Email', 'email', 'For invoices (optional)')}
    <div class="two"><div>${f('date', 'Date', 'date')}</div><div>${f('time', 'Start', 'time')}</div></div>
    <label class="f" for="f_duration">How long</label>
    <select class="t" id="f_duration">${DURATIONS.map(d => `<option value="${d}" ${(+j.duration || 3) === d ? 'selected' : ''}>${d} hour${d === 1 ? '' : 's'}</option>`).join('')}</select>
    <div class="sub warnline hidden" id="f_clash"></div>
    ${f('vehicle', 'Vehicle', 'text', 'e.g. 2021 Tahoe, black')}
    ${f('address', 'Address', 'text', 'Where the job is')}
    ${f('services', 'Services', 'text', 'e.g. Full interior + Biosweep')}
    ${f('city', 'City', 'text', 'e.g. Canton')}
    <label class="f" for="f_status">Status</label>
    <select class="t" id="f_status">${STATUSES.map(s => `<option ${s === j.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
    <label class="f" for="f_notes">Notes</label><textarea class="t" id="f_notes" placeholder="Gate code, pet hair, customer requests…">${esc(j.notes)}</textarea>
  </div>
  <button class="btn block" id="saveJob">${id ? 'Save' : 'Start job'}</button>
  ${id ? '<div style="height:10px"></div><button class="btn danger block" id="delJob">Delete job</button>' : ''}`;
  $('#f_customer').setAttribute('list', 'custList');
  const clash = () => { const probe = { ...j, date: $('#f_date').value, time: $('#f_time').value, duration: +$('#f_duration').value, status: 'Scheduled' }; const o = overlaps(probe, allJobs); const el = $('#f_clash'); el.classList.toggle('hidden', !o.length); el.textContent = o.length ? 'Overlaps with ' + o.map(x => (x.customer || 'a job') + ' at ' + fmtTime(jobStart(x))).join(', ') : ''; };
  ['f_date', 'f_time', 'f_duration'].forEach(id => $('#' + id).addEventListener('change', clash)); clash();
  addrAuto($('#f_address'), $('#f_city'));
  $('#saveJob').onclick = async () => {
    for (const k of ['customer', 'phone', 'email', 'date', 'time', 'vehicle', 'address', 'city', 'services', 'status', 'notes']) j[k] = $('#f_' + k).value.trim();
    j.duration = +$('#f_duration').value;
    await DB.put('jobs', j);
    await linkCustomer(j);
    nav('#/job/' + j.id);
  };
  if (id) $('#delJob').onclick = async () => {
    if (!(await ask('Delete this job and its photos from the app? Anything already in Drive stays there.'))) return;
    for (const m of await DB.byJob(id)) { await DB.del('media', m.id); dropUrl(m.id); }
    await DB.del('jobs', id); nav('#/'); updateSyncBadge();
  };
}

function areaCard(area, list, all, cloud) {
  const done = list.filter(b => latestAfter(all, b.id)).length;
  return `<div class="card">
    <h2>${AREAS[area]}<span class="count">${done}/${list.length} afters</span></h2>
    <div class="seg">
      <button class="btn" data-shoot="${area}" data-mode="photo">${I('camera')}Befores</button>
      <button class="btn ghost" data-shoot="${area}" data-mode="video">${I('video')}Video</button>
      <button class="btn ghost" data-upload="${area}">${I('upload')}Upload</button>
    </div>
    ${list.length ? `<div class="grid">${list.map(b => {
      const a = latestAfter(all, b.id);
      const bp = previewBlob(b), ap = a && previewBlob(a);
      return `<div class="shot"><div class="pair">
        <button class="thumb" data-shot="${b.id}" style="background-image:url(${bp ? blobUrl(b.id, bp) : ''})"><span class="tag">BEFORE ${b.n}</span>${isVideo(b) ? '<span class="vid">' + I('play') + 'Video</span>' : ''}${cloud(b)}</button>
        ${a ? `<button class="thumb" data-shot="${b.id}" style="background-image:url(${ap ? blobUrl(a.id, ap) : ''})"><span class="tag">AFTER</span>${isVideo(a) ? '<span class="vid">' + I('play') + 'Video</span>' : ''}${cloud(a)}</button>`
            : `<button class="add-after" data-after="${b.id}">${I('plus')}After</button>`}
      </div><div class="lbl">${esc(b.label || 'Shot ' + b.n)}</div></div>`;
    }).join('')}</div>` : ''}
  </div>`;
}

async function renderJob(v, id) {
  const job = await DB.get('jobs', id);
  if (!job) { nav('#/'); return; }
  currentJob = job;
  setHeader(job.customer || 'Job', '#/');
  const all = await DB.byJob(id);
  const checklists = all.filter(m => m.kind === 'checklist').sort((a, b) => a.n - b.n);
  const befores = all.filter(m => m.kind === 'before').sort((a, b) => a.n - b.n);
  const cloud = m => m.driveId ? '<span class="cloud" title="In Drive">' + I('check') + '</span>' : '';
  v.innerHTML = driveBannerHtml() + `
  <div class="card">
    <h2>${esc(job.vehicle || 'Vehicle')}<span class="count"><a href="#/edit/${job.id}" style="color:var(--royal)">Edit</a></span></h2>
    <dl class="info">
      ${job.services ? `<dt>Services</dt><dd>${esc(job.services)}</dd>` : ''}
      ${job.price ? `<dt>Price</dt><dd>${esc(job.price)}</dd>` : ''}
      ${job.phone ? `<dt>Phone</dt><dd><a href="tel:${esc(job.phone)}">${esc(job.phone)}</a></dd>` : ''}
      ${job.date ? `<dt>When</dt><dd>${new Date(job.date + 'T12:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}${job.time ? ', ' + fmtTime(jobStart(job)) + '–' + fmtTime(jobEnd(job)) : ''}</dd>` : ''}
      ${job.address || job.city ? `<dt>Address</dt><dd><button class="addr-link" id="jobAddr">${esc(addrOf(job))}</button></dd>` : ''}
      ${job.notes ? `<dt>Notes</dt><dd>${esc(job.notes)}</dd>` : ''}
    </dl>
    <label class="f" for="jobStatus">Status</label>
    <select class="t" id="jobStatus">${STATUSES.map(s => `<option ${s === job.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
    <button class="btn ghost block" id="custView" style="margin-top:12px">Client view</button>
  </div>

  ${quoteCardHtml(job)}
  ${jobCostsHtml(job, await DB.all('expenses'))}
  ${msgCardHtml(job)}

  <div class="card">
    <h2>Signed checklist<span class="count">${checklists.length ? checklists.length + ' photo' + (checklists.length > 1 ? 's' : '') : 'Not yet'}</span></h2>
    ${checklists.length ? `<div class="checklist-grid">${checklists.map(m => `<button class="thumb" data-check="${m.id}" style="background-image:url(${blobUrl(m.id, m.blob)})"><span class="tag">SIGNED</span>${cloud(m)}</button>`).join('')}</div>` : ''}
    <div class="row" style="margin-top:10px"><button class="btn ${checklists.length ? 'ghost' : ''}" id="addChecklist">${checklists.length ? 'Add page' : 'Photo the signed checklist'}</button>${checklists.length ? `<button class="btn" id="sendReport">${job.reportShared ? 'Resend report' : 'Condition report'}</button>` : ''}</div>
  </div>

  ${['interior', 'exterior'].map(area => areaCard(area, befores.filter(b => areaOf(b) === area), all, cloud)).join('')}
  <div class="card">
    <h2>Close out<span class="count">${pairsOf(all).length} pairs ready</span></h2>
    <a class="btn alt block" style="margin-top:10px;text-decoration:none" href="#/close/${job.id}">${job.drafts ? 'Open post drafts' : 'Close out & build posts'}</a>
  </div>`;
  $('#jobStatus').onchange = async e => { job.status = e.target.value; await DB.put('jobs', job); };
  if ($('#jobAddr')) $('#jobAddr').onclick = () => openDirections(addrOf(job));
  bindQuote(v, job);
  bindMsgs(v, job);
  bindJobCosts(v, job);
  $('#addChecklist').onclick = () => { const p = $('#pickChecklist'); p.value = ''; p.click(); };
  if ($('#sendReport')) $('#sendReport').onclick = () => reportSheet(job);
  if ($('#custView')) $('#custView').onclick = async () => { const c = job.customerId ? await DB.get('customers', job.customerId) : await linkCustomer(job); if (c) previewPortal(c, () => render()); };
  v.querySelectorAll('[data-shoot]').forEach(b => b.onclick = () => takeBefores(job, b.dataset.mode, b.dataset.shoot));
  v.querySelectorAll('[data-upload]').forEach(b => b.onclick = () => { currentArea = b.dataset.upload; const p = $('#pickBefore'); p.value = ''; p.click(); });
  v.querySelectorAll('[data-shot]').forEach(b => b.onclick = () => Viewer.openShot(job, befores.find(x => x.id === b.dataset.shot)));
  v.querySelectorAll('[data-after]').forEach(b => b.onclick = () => takeAfter(job, befores.find(x => x.id === b.dataset.after)));
  v.querySelectorAll('[data-check]').forEach(b => b.onclick = () => Viewer.openSingle(job, checklists.find(x => x.id === b.dataset.check)));
  updateSyncBadge();
}

function renderSettings(v) {
  setHeader('Settings', '#/');
  const s = Settings.get();
  const connected = !!Drive.token();
  v.innerHTML = `<div class="card">
    <h2>Google Drive</h2>
    <div class="sub">${connected ? 'Connected. New photos upload automatically when you have signal.' : Drive.connectedOnce() ? 'Sign-in expired (Google sign-ins last about an hour). Reconnect to upload.' : 'Not connected yet. Photos stay safely in the app until you connect.'}</div>
    <label class="f" for="s_client">Google OAuth Client ID</label>
    <input class="t" id="s_client" placeholder="1234-abc.apps.googleusercontent.com" value="${esc(s.clientId)}">
    <label class="f" for="s_email">Google account to use</label>
    <input class="t" id="s_email" type="email" placeholder="office@cleanshelldetailing.com" value="${esc(s.email || 'office@cleanshelldetailing.com')}">
    <label class="f" for="s_root">Drive folder name</label>
    <input class="t" id="s_root" placeholder="Clean Shell Jobs" value="${esc(s.rootName || 'Clean Shell Jobs')}">
    <div class="row" style="margin-top:12px">
      <button class="btn" id="s_save">${connected ? 'Save' : 'Save & connect'}</button>
      ${connected ? '<button class="btn ghost" id="s_out">Disconnect</button>' : ''}
    </div>
  </div>
  <div class="card">
    <h2>Install on your phone</h2>
    <div class="sub">iPhone: open this page in Safari → Share → <b>Add to Home Screen</b>. Android: Chrome menu → <b>Install app</b>.</div>
  </div>
  <div class="card"><div class="sub">Clean Shell Jobs · phase 9 · photos are stored inside this app and in Drive, never in your camera roll.</div></div>`;
  $('#s_save').onclick = () => {
    const rootName = $('#s_root').value.trim() || 'Clean Shell Jobs';
    const patch = { clientId: $('#s_client').value.trim(), email: $('#s_email').value.trim(), rootName };
    if (rootName !== (s.rootName || 'Clean Shell Jobs')) patch.rootId = null;
    Settings.set(patch);
    if (connected) { toast('Saved'); render(); } else Drive.signIn();
  };
  if (connected) $('#s_out').onclick = () => { Drive.signOut(); render(); updateSyncBadge(); };
}

document.addEventListener('click', e => { const a = e.target.closest('a[href^="#/"]'); if (a) { e.preventDefault(); nav(a.getAttribute('href')); } });

setTimeout(() => { pollInbox(); queueBookingPublish(); queueFollowupSync(); }, 2500);

$('#backBtn').innerHTML = I('back'); $('#addBtn').innerHTML = I('plus'); $('#settingsBtn').innerHTML = I('gear'); $('#syncBtn').innerHTML = I('cloud');
